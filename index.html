<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rupsona AI ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background">

<div class="app-container">

<!-- HEADER -->

<header class="header">

<div class="logo">
❤️ Rupsona AI
</div>

<div class="online-status">
<span class="online-dot"></span>
Online
</div>

</header>


<!-- PROFILE SECTION -->

<section class="profile-section">

<div class="avatar-container">

<div class="avatar-glow"></div>

<div class="avatar" id="avatar">
👩🏻
</div>

<div class="heart heart1">❤️</div>
<div class="heart heart2">💕</div>
<div class="heart heart3">💗</div>

</div>

<h1>Rupsona</h1>

<p class="subtitle">
Your Virtual AI Girlfriend ❤️
</p>

<p class="welcome-text">
Hey Miraj! 🥰 I'm waiting for you.
</p>

</section>


<!-- CHAT SECTION -->

<section class="chat-section">

<div class="chat-header">

<h3>💬 Love Chat</h3>

<button onclick="clearChat()" class="clear-btn">
Clear Chat
</button>

</div>


<div class="chat-box" id="chat">

<div class="message bot-message">

<div class="message-name">
Rupsona ❤️
</div>

Hey Miraj! 🥰

Welcome back! কেমন আছো আজকে?
তোমার সাথে কথা বলতে ভালো লাগছে! ❤️

</div>

</div>

<div class="typing" id="typing">
Rupsona is typing...
</div>


<!-- INPUT -->

<div class="input-area">

<button class="voice-btn" onclick="voiceInput()">
🎙️
</button>

<input
type="text"
id="message"
placeholder="Message Rupsona..."
autocomplete="off"
>

<button class="send-btn" onclick="sendMessage()">
➤
</button>

</div>

</section>


<!-- FOOTER -->

<footer>

Made with ❤️ for Miraj

<p>Rupsona AI © 2026</p>

</footer>

</div>

</div>


<script src="script.js"></script>

</body>
</html>
